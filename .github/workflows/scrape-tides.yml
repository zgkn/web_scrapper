name: Scrape SG tides

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: "Start year"
        default: "2015"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Scrape
        run: python scrape_tides.py --start-year "${{ inputs.start_year || '2015' }}" --out data
      - name: Preview
        run: |
          head -5 data/tides.csv
          echo ...
          tail -3 data/tides.csv
          wc -l data/*.csv
      - uses: actions/upload-artifact@v4
        with:
          name: tides-output
          path: data/
      - name: Commit data to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update tide data"
          git push
